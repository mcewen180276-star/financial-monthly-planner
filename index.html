<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10263d"><title>Payday Planner</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172c42;background:#f2f6fa}*{box-sizing:border-box}body{margin:0}header{background:#10263d;color:white;padding:18px 16px}header h1{margin:0;font-size:22px}header small{color:#b8cfdf}main{max-width:1000px;margin:auto;padding:14px}.tabs{display:flex;gap:6px;overflow:auto;padding:10px 0}.tabs button{white-space:nowrap}.tabs button.active{background:#1479b8;color:white}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;background:#e1eaf1;color:#18334b;cursor:pointer}button.primary{background:#1479b8;color:white}button.danger{color:#ad2533;background:#ffe7e9}button:disabled{opacity:.45}input,select{width:100%;padding:11px;border:1px solid #c6d3df;border-radius:9px;background:white;min-width:0}label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}.card{background:white;border:1px solid #dce5ec;border-radius:15px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #1b42600a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:white;border-radius:13px;padding:14px;border:1px solid #dce5ec}.metric small{color:#63798c}.metric strong{display:block;font-size:clamp(21px,5vw,30px);margin-top:6px;overflow-wrap:anywhere}.green{color:#14805e}.red{color:#bb3845}.muted{color:#667b8e}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #e9eef3}.row:last-child{border:0}.row>div{min-width:0}.pill{display:inline-block;padding:4px 8px;border-radius:8px;background:#eaf3fb;font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.hide{display:none!important}h2{font-size:19px;margin:8px 0 14px}h3{font-size:16px;margin:0 0 10px}.note{font-size:13px;color:#62798c;line-height:1.5}.alert{background:#fff4df;padding:10px;border-radius:9px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{border-radius:7px;min-height:57px;background:#f0f5f9;padding:5px;font-size:12px;overflow:hidden}.day.today{outline:2px solid #1479b8}.day .dot{display:block;font-size:10px;color:#a43e47;overflow-wrap:anywhere}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar>*{flex:1}.toolbar button{flex:0 0 auto}dialog{border:0;border-radius:16px;max-width:480px;width:calc(100% - 24px);padding:20px;box-shadow:0 12px 50px #0005}dialog::backdrop{background:#142c43a8}.end{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}#toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#10263d;color:white;padding:12px;border-radius:10px;display:none;z-index:10} @media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.cols{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><div style="max-width:1000px;margin:auto"><h1>💷 Payday Planner</h1><small>Your bills, payday and spending money in one place</small></div></header><main><nav class="tabs" id="tabs"><button data-tab="dashboard" class="active">Dashboard</button><button data-tab="bills">Bills</button><button data-tab="calendar">Calendar</button><button data-tab="budget">Budget</button><button data-tab="settings">Settings & backup</button></nav><section id="dashboard"></section><section id="bills" class="hide"></section><section id="calendar" class="hide"></section><section id="budget" class="hide"></section><section id="settings" class="hide"></section></main><dialog id="editor"><form id="billForm"><h2 id="editTitle">Add bill</h2><input type="hidden" name="id"><label>Bill name</label><input name="name" required maxlength="100" placeholder="e.g. Electricity"><div class="cols"><div><label>Amount (£)</label><input name="amount" type="number" min="0" step="0.01" required></div><div><label>Frequency</label><select name="frequency"><option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="fortnightly">Every 2 weeks</option><option value="fourweekly">Every 4 weeks</option><option value="yearly">Yearly</option><option value="once">One-off</option></select></div></div><label>Next / first due date</label><input name="due" type="date" required><label>Category</label><select name="category"><option>Housing</option><option>Utilities</option><option>Insurance</option><option>Transport</option><option>Subscriptions</option><option>Debt</option><option>Other</option></select><label>Notes (optional)</label><input name="notes" maxlength="200"><div class="end"><button type="button" onclick="editor.close()">Cancel</button><button class="primary" type="submit">Save bill</button></div></form></dialog><div id="toast" role="status"></div><script>
'use strict';const KEY='payday-planner-v1';const today=()=>{let d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};const dateStr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const parse=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};const fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{};if(!state||!Array.isArray(state.bills))state={paydayDay:28,weekend:'previous',balance:0,income:0,reserves:[],bills:[],paid:{},budget:{groceries:0,transport:0,other:0,savings:0}};state.paid??={};state.budget??={groceries:0,transport:0,other:0,savings:0};state.weekend??='previous';let tab='dashboard',calendarOffset=0;function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Storage is full or unavailable. Export a backup to keep your data.')}}function notify(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2300)}function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function monthDate(y,m,day){return new Date(y,m,Math.min(Number(day)||1,new Date(y,m+1,0).getDate()))}function adjustPay(d){let x=new Date(d);if(state.weekend==='previous'){if(x.getDay()===6)x=addDays(x,-1);if(x.getDay()===0)x=addDays(x,-2)}if(state.weekend==='next'){if(x.getDay()===6)x=addDays(x,2);if(x.getDay()===0)x=addDays(x,1)}return x}function nextPay(now=today()){for(let i=-1;i<15;i++){let d=adjustPay(monthDate(now.getFullYear(),now.getMonth()+i,state.paydayDay));if(d>=now)return d}return now}function previousPay(now=today()){for(let i=1;i>=-15;i--){let d=adjustPay(monthDate(now.getFullYear(),now.getMonth()+i,state.paydayDay));if(d<now)return d}return now}function addMonthsAnchored(base,n){return monthDate(base.getFullYear(),base.getMonth()+n,base.getDate())}function occurrences(b,from,to){let start=parse(b.due),out=[],freq=b.frequency||'monthly';if(freq==='once'){if(start>=from&&start<=to)out.push(start)}else if(freq==='monthly'||freq==='yearly'){let step=freq==='yearly'?12:1;for(let i=0;i<300;i++){let d=monthDate(start.getFullYear(),start.getMonth()+i*step,start.getDate());if(d>to)break;if(d>=from)out.push(d)}}else{let step={weekly:7,fortnightly:14,fourweekly:28}[freq]||7;let i=Math.max(0,Math.floor((from-start)/86400000/step)-1);for(;i<2500;i++){let d=addDays(start,i*step);if(d>to)break;if(d>=from)out.push(d)}}return out.map(d=>({bill:b,date:d,key:b.id+'|'+dateStr(d),paid:!!state.paid[b.id+'|'+dateStr(d)]}))}function allEvents(from,to){return state.bills.flatMap(b=>occurrences(b,from,to)).sort((a,b)=>a.date-b.date||a.bill.name.localeCompare(b.bill.name))}function metric(label,val,cls=''){return `<div class="metric"><small>${label}</small><strong class="${cls}">${val}</strong></div>`}function upcoming(){let now=today(),pay=nextPay(now);return {now,pay,events:allEvents(now,addDays(pay,-1))}}function render(){document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hide',x.id!==tab));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));({dashboard:renderDashboard,bills:renderBills,calendar:renderCalendar,budget:renderBudget,settings:renderSettings})[tab]()}function renderDashboard(){let {now,pay,events}=upcoming(),unpaid=events.filter(e=>!e.paid),total=unpaid.reduce((s,e)=>s+Number(e.bill.amount),0),budget=Object.values(state.budget).reduce((a,b)=>a+(Number(b)||0),0),left=Number(state.balance)-total-budget;document.getElementById('dashboard').innerHTML=`<div class="card"><div class="row"><div><small class="muted">Today: ${fmt(now)}</small><h2 style="margin:4px 0">Next payday: ${fmt(pay)}</h2><span class="pill">${Math.round((pay-now)/86400000)} days to go</span></div><button class="primary" onclick="editBill()">+ Add bill</button></div><div class="note">Bills due from today up to (but not including) your next payday. Overdue unpaid bills are listed separately below.</div></div><div class="grid">${metric('Bills still to pay',money(total),'red')}${metric('Current balance',money(state.balance))}${metric('Set aside for spending & savings',money(budget))}${metric('Left after all planned costs',money(left),left>=0?'green':'red')}</div><div class="card" style="margin-top:12px"><div class="row"><h3>Upcoming payments (${unpaid.length})</h3><button onclick="switchTab('bills')">All bills</button></div>${unpaid.length?unpaid.map(e=>eventRow(e)).join(''):'<p class="muted">No unpaid bills due before payday.</p>'}</div><div class="card"><h3>Overdue unpaid bills</h3><div id="overdue">${overdueEvents().length?overdueEvents().map(eventRow).join(''):'<p class="muted">No overdue bills recorded.</p>'}</div></div><div class="card"><h3>Quick update</h3><label>Bank balance now (£)</label><div class="toolbar"><input id="quickBalance" type="number" step="0.01" value="${Number(state.balance)||0}"><button class="primary" onclick="state.balance=Number(document.getElementById('quickBalance').value)||0;save();render()">Update</button></div><p class="note">Enter your actual available balance, not your expected payday income. Payments marked paid are excluded from the bill total; update your bank balance separately when money leaves your account.</p></div>`}function overdueEvents(){let now=today(),from=addDays(now,-370);return allEvents(from,addDays(now,-1)).filter(e=>!e.paid)}function eventRow(e){return `<div class="row"><div><b>${esc(e.bill.name)}</b><div class="muted" style="font-size:12px">${fmt(e.date)} · ${esc(e.bill.category||'Other')} ${e.paid?'· Paid':''}</div></div><div style="text-align:right"><b>${money(e.bill.amount)}</b><div class="actions" style="justify-content:flex-end;margin-top:5px"><button onclick="togglePaid('${e.key}')">${e.paid?'Undo paid':'Mark paid'}</button></div></div></div>`}function renderBills(){document.getElementById('bills').innerHTML=`<div class="card"><div class="row"><h2>My bills (${state.bills.length})</h2><button class="primary" onclick="editBill()">+ Add bill</button></div><input id="billSearch" placeholder="Search bills" oninput="filterBills()"><div id="billList">${billRows()}</div></div>`}function billRows(query=''){return state.bills.filter(b=>(b.name+' '+b.category).toLowerCase().includes(query.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name)).map(b=>`<div class="row"><div><b>${esc(b.name)}</b><div class="muted" style="font-size:12px">${esc(b.frequency)} · First due ${fmt(parse(b.due))} · ${esc(b.category||'Other')}</div></div><div style="text-align:right"><b>${money(b.amount)}</b><div class="actions" style="margin-top:5px"><button onclick="editBill('${b.id}')">Edit</button><button class="danger" onclick="deleteBill('${b.id}')">Delete</button></div></div></div>`).join('')||'<p class="muted">No bills added yet.</p>'}function filterBills(){document.getElementById('billList').innerHTML=billRows(document.getElementById('billSearch').value)}function editBill(id){let f=document.getElementById('billForm');f.reset();let b=state.bills.find(x=>x.id===id);f.elements.id.value=b?.id||'';f.elements.name.value=b?.name||'';f.elements.amount.value=b?.amount??'';f.elements.frequency.value=b?.frequency||'monthly';f.elements.due.value=b?.due||dateStr(today());f.elements.category.value=b?.category||'Housing';f.elements.notes.value=b?.notes||'';document.getElementById('editTitle').textContent=b?'Edit bill':'Add bill';document.getElementById('editor').showModal()}document.getElementById('billForm').addEventListener('submit',e=>{e.preventDefault();let f=e.target,old=state.bills.find(x=>x.id===f.elements.id.value),b={id:old?.id||uid(),name:f.elements.name.value.trim(),amount:Number(f.elements.amount.value),frequency:f.elements.frequency.value,due:f.elements.due.value,category:f.elements.category.value,notes:f.elements.notes.value};if(!b.name||!b.due||!Number.isFinite(b.amount)||b.amount<0)return;state.bills=state.bills.filter(x=>x.id!==b.id);state.bills.push(b);save();document.getElementById('editor').close();render();notify('Bill saved')});function deleteBill(id){if(!confirm('Delete this bill and its payment history?'))return;state.bills=state.bills.filter(b=>b.id!==id);Object.keys(state.paid).filter(k=>k.startsWith(id+'|')).forEach(k=>delete state.paid[k]);save();render()}function togglePaid(key){state.paid[key]=!state.paid[key];if(!state.paid[key])delete state.paid[key];save();render()}function renderCalendar(){let d=new Date(today().getFullYear(),today().getMonth()+calendarOffset,1),end=new Date(d.getFullYear(),d.getMonth()+1,0),events=allEvents(d,end),days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];let html=`<div class="card"><div class="toolbar"><button onclick="calendarOffset--;render()">‹</button><h2 style="text-align:center;margin:0">${d.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h2><button onclick="calendarOffset++;render()">›</button><button onclick="calendarOffset=0;render()">Today</button></div><div class="calendar" style="margin-top:15px">${days.map(x=>`<b style="font-size:12px;text-align:center">${x}</b>`).join('')}${Array.from({length:(d.getDay()+6)%7},()=>'<div></div>').join('')}${Array.from({length:end.getDate()},(_,i)=>{let n=i+1,dt=new Date(d.getFullYear(),d.getMonth(),n),ev=events.filter(e=>e.date.getDate()===n);return `<div class="day ${dateStr(dt)===dateStr(today())?'today':''}"><b>${n}</b>${ev.map(e=>`<span class="dot" style="color:${e.paid?'#15805d':'#a43e47'}">${esc(e.bill.name)} ${money(e.bill.amount)}</span>`).join('')}</div>`}).join('')}</div></div><div class="card"><h3>Payments this month</h3>${events.length?events.map(eventRow).join(''):'<p class="muted">No payments scheduled.</p>'}</div>`;document.getElementById('calendar').innerHTML=html}function renderBudget(){let {pay}=upcoming(),days=Math.max(1,Math.ceil((pay-today())/86400000)),sum=Object.values(state.budget).reduce((a,b)=>a+Number(b||0),0);document.getElementById('budget').innerHTML=`<div class="card"><h2>Money to set aside until payday</h2><p class="note">These are optional extra amounts to reserve between now and your next payday, not recurring bills. Change them whenever you like.</p>${Object.entries({groceries:'Food & groceries',transport:'Petrol & travel',other:'Other spending',savings:'Savings'}).map(([k,v])=>`<label>${v} (£)</label><input id="bud_${k}" type="number" min="0" step="0.01" value="${Number(state.budget[k])||0}">`).join('')}<div class="end"><button class="primary" onclick="saveBudget()">Save spending plan</button></div><div class="row"><b>Total reserved</b><b>${money(sum)}</b></div><div class="row"><b>Average reserved per day (${days} days)</b><b>${money(sum/days)}</b></div></div>`}function saveBudget(){for(let k of Object.keys(state.budget))state.budget[k]=Math.max(0,Number(document.getElementById('bud_'+k).value)||0);save();render();notify('Budget saved')}function renderSettings(){document.getElementById('settings').innerHTML=`<div class="card"><h2>Payday settings</h2><label>Monthly payday (day of month)</label><input id="paydayDay" type="number" min="1" max="31" value="${state.paydayDay}"><label>If payday falls on a weekend</label><select id="weekend"><option value="previous" ${state.weekend==='previous'?'selected':''}>Pay on previous working day</option><option value="next" ${state.weekend==='next'?'selected':''}>Pay on next Monday</option><option value="none" ${state.weekend==='none'?'selected':''}>Keep the same date</option></select><p class="note">For dates such as the 31st, shorter months use their last day. Weekend adjustments don't account for bank holidays.</p><button class="primary" onclick="saveSettings()">Save payday settings</button></div><div class="card"><h2>Backup & restore</h2><p class="note">Data stays in this browser on this device. Export a backup regularly, especially before clearing browser data or changing phones. No bank connection or subscription needed.</p><div class="actions"><button class="primary" onclick="exportBackup()">Download backup</button><button onclick="document.getElementById('importFile').click()">Restore backup</button><input class="hide" id="importFile" type="file" accept="application/json,.json" onchange="importBackup(this.files[0])"></div></div><div class="card"><h2>Privacy & reset</h2><p class="note">No financial details are uploaded to a server by this app. Data is stored locally using browser storage.</p><button class="danger" onclick="resetAll()">Erase all app data</button></div>`}function saveSettings(){let n=Number(document.getElementById('paydayDay').value);if(!Number.isInteger(n)||n<1||n>31)return alert('Choose a day between 1 and 31');state.paydayDay=n;state.weekend=document.getElementById('weekend').value;save();render();notify('Settings saved')}function exportBackup(){let blob=new Blob([JSON.stringify({app:'payday-planner',version:1,data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='payday-planner-backup-'+dateStr(today())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function importBackup(file){if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.app!=='payday-planner'||!Array.isArray(obj.data?.bills))throw Error('Not a Payday Planner backup');if(!confirm('Replace all current planner data with this backup?'))return;state=obj.data;state.paid??={};state.budget??={groceries:0,transport:0,other:0,savings:0};save();render();notify('Backup restored')}catch(e){alert('Could not restore: '+e.message)}}function resetAll(){if(confirm('Erase all bills, payment records and settings? This cannot be undone without a backup.')){localStorage.removeItem(KEY);location.reload()}}function switchTab(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}document.getElementById('tabs').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)switchTab(b.dataset.tab)});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
